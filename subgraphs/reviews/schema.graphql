extend schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key"])

type Review {
  id: ID!
  body: String!
  rating: Int!
}

# products 서브그래프의 엔티티를 확장한다. 라우터가 두 서브그래프를 한 타입으로 합친다.
type Product @key(fields: "id") {
  id: ID!
  reviews: [Review!]!
  averageRating: Float
}

type Query {
  reviews: [Review!]!
}
